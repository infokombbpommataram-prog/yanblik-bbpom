<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - AI Yanblik BBPOM</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{font-family:'Segoe UI',Roboto,sans-serif;background:#f4f6f9;display:flex;align-items:center;min-height:100vh}
.login-box{max-width:380px;margin:0 auto;width:100%}
</style>
</head>
<body>
<div class="login-box">
  <div class="card p-4 shadow-sm">
    <h5 class="fw-bold text-center">🤖 AI Yanblik BBPOM</h5>
    <p class="text-muted text-center small">BBPOM di Mataram — Login Petugas</p>
    <div class="mb-2"><label class="form-label fw-semibold">Username</label><input id="u" class="form-control" autocomplete="username"></div>
    <div class="mb-3"><label class="form-label fw-semibold">Password</label><input id="p" type="password" class="form-control" autocomplete="current-password"></div>
    <div id="err" class="alert alert-danger py-2 d-none">Username / password salah.</div>
    <button class="btn btn-primary w-100" onclick="doLogin()">Masuk</button>
  </div>
</div>
<script>
// ponytail: gate frontend saja, bypass via devtools mungkin. Naik kelas saat perlu: session via Functions + cookie httpOnly.
function doLogin(){
  if(document.getElementById('u').value==='Admin'&&document.getElementById('p').value==='adaptif2025'){
    sessionStorage.setItem('yanblik_auth','1');
    location.replace('home.html');
  } else document.getElementById('err').classList.remove('d-none');
}
document.getElementById('p').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
if(sessionStorage.getItem('yanblik_auth')==='1')location.replace('home.html');
</script>
</body>
</html>
