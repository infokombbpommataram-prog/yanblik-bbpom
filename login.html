<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Yanblik BBPOM</title>
<link rel="stylesheet" href="theme.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{max-width:380px;width:100%;text-align:center}
h1{font-size:34px;margin-bottom:8px}
p{font-size:15px;color:var(--muted);margin-bottom:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px;box-shadow:0 4px 24px rgba(0,0,0,.04);text-align:left}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 5px;font-family:-apple-system,'Segoe UI',sans-serif}
input{width:100%;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:14px;background:#fff;color:var(--ink)}
input:focus{outline:none;border-color:var(--ink)}
button{width:100%;font-size:15px;font-weight:600;padding:11px;border:none;border-radius:9px;background:var(--dark);color:#faf9f7;cursor:pointer}
.err{font-size:13px;color:#b3261e;margin-bottom:12px;display:none}
</style>
</head>
<body>
<div class="box">
  <h1>Yanblik.</h1>
  <p>BBPOM di Mataram — masuk untuk mencatat dan memantau layanan.</p>
  <div class="card">
    <label>Username</label><input id="u" autocomplete="username">
    <label>Password</label><input id="p" type="password" autocomplete="current-password">
    <div id="err" class="err">Username / password salah.</div>
    <button onclick="doLogin()">Masuk</button>
  </div>
</div>
<script>
// ponytail: gate frontend saja, bypass via devtools mungkin. Naik kelas saat perlu: session via Functions + cookie httpOnly.
function doLogin(){
  if(document.getElementById('u').value==='Admin'&&document.getElementById('p').value==='adaptif2025'){
    sessionStorage.setItem('yanblik_auth','1');
    location.replace('home.html');
  } else document.getElementById('err').style.display='block';
}
document.getElementById('p').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
if(sessionStorage.getItem('yanblik_auth')==='1')location.replace('home.html');
</script>
</body>
</html>
